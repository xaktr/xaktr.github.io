<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242933"/>
      <stop offset="100%" stop-color="#191c22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a72ff"/>
      <stop offset="100%" stop-color="#3458d4"/>
    </linearGradient>
  </defs>

  <!-- Container badge with subtle bevel -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#363e4d" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Monogram paths: Interlocked 'A' and 'R' -->
  <g fill="none" stroke="#E9DDD5" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A left diagonal -->
    <path d="M 26 72 L 48 26 L 55 26"/>
    <!-- Central shared vertical spine -->
    <path d="M 55 26 L 55 72"/>
    <!-- A crossbar -->
    <path d="M 36 53 L 55 53"/>
    <!-- R upper loop -->
    <path d="M 55 26 L 68 26 C 77.5 26 81.5 32 81.5 39.5 C 81.5 47 77.5 53 68 53 L 55 53"/>
    <!-- R diagonal kick leg -->
    <path d="M 64 53 L 79 72"/>
  </g>

  <!-- Accent signature dot -->
  <circle cx="87.5" cy="71" r="4" fill="url(#accentGrad)"/>
</svg>
